name: Discord aktuality

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stáhnout zprávy z Discordu
        run: node scripts/fetch-news.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ALLOWED_AUTHOR_IDS: ${{ secrets.ALLOWED_AUTHOR_IDS }}

      - name: Uložit změny do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news-img
          if git diff --staged --quiet; then
            echo "Žádné změny."
          else
            git commit -m "Aktualizace aktualit z Discordu"
            git push
          fi
